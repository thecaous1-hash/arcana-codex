<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spire Codex 어드바이저 (한국어)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  /* 하이브리드: 뼈대는 중립 near-black, 포인트만 앰버 (게임 무드) */
  --bg:#0a0a0b; --bg2:#101012; --bg3:#17171a; --bg4:#1e1e22;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --gold:#f0a83c; --gold2:#f5b855; --gold3:#f8cd7a;
  --red:#c0392b; --red2:#e0503c; --green:#3a9e5a; --green2:#4bbf6e;
  --blue:#3a7ca8; --blue2:#4b9fd0;
  --text:#f0ede8; --text2:#8a8a8f; --text3:#5f5f66;
  --s:#f0a83c; --a:#e08a3c; --b:#3a9e5a; --c:#3a8fd0; --d:#9a6ad8; --f:#667079;
  --radius:8px;
  /* 설계서 디자인 토큰 별칭 */
  --bg-page:var(--bg); --bg-card:var(--bg2); --bg-hover:var(--bg3);
  --border-strong:var(--border2); --text-1:var(--text); --text-2:var(--text2); --text-3:var(--text3);
  --accent:var(--gold); --accent-soft:rgba(240,168,60,.12); --danger:var(--red); --danger-soft:rgba(192,57,43,.14);
  --radius-card:12px; --radius-ctrl:8px; --pad-card:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(240,168,60,.05),transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(192,57,43,.04),transparent 55%);pointer-events:none;z-index:0}
.cinzel{font-family:'Cinzel',serif}

/* 상단 */
header{position:sticky;top:0;z-index:50;background:rgba(12,11,9,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold2);letter-spacing:.05em;white-space:nowrap}
.logo small{display:block;font-size:.6rem;color:var(--text3);margin-top:2px}
.char-tabs{display:flex;gap:6px;flex-wrap:wrap}
.char-tab{display:flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);border-radius:var(--radius);cursor:pointer;font-size:.88rem;font-weight:500;transition:all .15s}
.char-tab .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.char-tab:hover{color:var(--text)}
.char-tab.on{color:#fff;font-weight:700;border-color:currentColor}
.ctx{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.ctx .fg{display:flex;align-items:center;gap:5px}
.ctx label{font-size:.76rem;color:var(--text2);white-space:nowrap}
.ctx input,.ctx select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:4px 8px;font-family:inherit;font-size:.82rem;border-radius:var(--radius);outline:none}
.ctx input{width:50px}

/* 3열 */
.cols{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:13px;padding:13px 18px 44px;position:relative;z-index:1;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column}
.panel-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:rgba(240,168,60,.04);border-radius:10px 10px 0 0}
.panel-h h2{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold2);letter-spacing:.05em;flex:1}
.panel-h .count{font-size:.74rem;color:var(--text3)}
.panel-b{padding:12px 13px;display:flex;flex-direction:column;gap:10px}

/* 칩(아키타입 필터) */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);border-radius:20px;cursor:pointer;font-size:.78rem;transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--gold)}
.chip.on{background:rgba(240,168,60,.16);border-color:var(--gold);color:var(--gold3);font-weight:700}
.chip .pct{font-size:.68rem;color:var(--text3);font-variant-numeric:tabular-nums}
.chip.on .pct{color:var(--gold2)}

/* 서브탭 */
.subtabs{display:flex;gap:0;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden}
.subtab{flex:1;text-align:center;padding:7px 0;font-size:.84rem;cursor:pointer;color:var(--text2);background:var(--bg3);transition:all .15s}
.subtab.on{background:rgba(240,168,60,.15);color:var(--gold3);font-weight:700}

/* 입력/자동완성 */
.search{position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 11px;font-family:inherit;font-size:.92rem;border-radius:var(--radius);outline:none}
.search input:focus{border-color:var(--gold)}
.search input::placeholder{color:var(--text3)}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);z-index:60;max-height:260px;overflow-y:auto;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.ac.open{display:block}
.ac-item{padding:8px 11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid rgba(46,37,21,.5)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.hi{background:rgba(240,168,60,.12)}
.ac-name{font-size:.9rem;color:var(--text)} .ac-en{font-size:.68rem;color:var(--text3)}
.ac-tier{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;padding:1px 6px;border:1px solid;border-radius:3px}

.row-btns{display:flex;gap:7px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:6px 12px;font-family:inherit;font-size:.8rem;cursor:pointer;border-radius:var(--radius);transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{border-color:var(--gold);color:var(--gold2);background:rgba(240,168,60,.08)}
.btn.green{border-color:var(--green);color:var(--green2);background:rgba(53,168,96,.1)}

/* 카드 타일(그림 자리=이미지 or 티어글자) */
.tiles{display:flex;flex-direction:column;gap:7px}
.tile{display:flex;align-items:stretch;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.art{width:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.1rem;font-weight:700;border-right:1px solid var(--border);background-size:cover;background-position:top center}
/* 등급 배지 (S/A/B/C/D) */
.gb{font-family:'Cinzel',serif;font-weight:700;font-size:.74rem;min-width:19px;height:19px;padding:0 3px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;border:1px solid;flex-shrink:0;vertical-align:middle}
.tile .body{flex:1;min-width:0;padding:7px 9px;display:flex;flex-direction:column;gap:3px}
.tile .nm{font-size:.92rem;color:var(--text);font-weight:500}
.tile .nm .en{font-size:.64rem;color:var(--text3);margin-left:5px}
.tile .sub{font-size:.72rem;color:var(--text3);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tile .x{align-self:center;margin:0 8px;color:var(--text3);cursor:pointer;flex-shrink:0}
.tile .x:hover{color:var(--red2)}
.badge{font-family:'Cinzel',serif;font-size:.64rem;font-weight:700;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.b-pick{color:var(--green2);border-color:var(--green);background:rgba(53,168,96,.1)}
.b-skip{color:var(--f);border-color:var(--f);background:rgba(102,119,136,.08)}
.b-maybe{color:var(--gold2);border-color:var(--gold);background:rgba(240,168,60,.08)}
.b-up{color:var(--gold3);border-color:var(--gold);background:rgba(245,216,122,.08)}
.b-cut{color:var(--red2);border-color:var(--red);background:rgba(192,57,43,.1)}
.b-role{color:var(--blue2);border-color:var(--blue);background:rgba(48,144,204,.08)}
.b-dup{color:var(--text2);border-color:var(--border2)}
.empty{padding:24px 13px;text-align:center;color:var(--text3);font-size:.84rem;line-height:1.7}
/* 게임 공식 효과 설명 서식 */
.gh{color:var(--gold3)} .gv{color:var(--gold2);font-weight:700}
.gv2{color:var(--text3);font-weight:600} .uarrow{color:var(--text3);margin:0 2px}
/* 카드 타입 배지 */
.tb{font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid;flex-shrink:0;vertical-align:middle}
.t-atk{color:#e8785a;border-color:#a8402e;background:rgba(224,112,90,.13)}
.t-skl{color:#5aa8e8;border-color:#2e5f8c;background:rgba(90,160,224,.13)}
.t-pow{color:#e8a838;border-color:#a87820;background:rgba(224,168,56,.13)}
.t-etc{color:var(--text3);border-color:var(--border2)}
/* 비용(에너지) */
.cb{font-family:'Cinzel',serif;font-weight:700;font-size:.66rem;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a90e2,#1e3f7a);color:#fff;flex-shrink:0;box-shadow:0 0 4px rgba(74,144,226,.4)}
/* 강화 버튼 */
.up-btn{background:transparent;border:1px solid var(--border2);color:var(--text3);font-size:.6rem;padding:1px 5px;border-radius:3px;cursor:pointer;font-family:'Cinzel',serif;flex-shrink:0}
.up-btn:hover{border-color:var(--gold);color:var(--gold2)}
.up-btn.on{background:rgba(245,216,122,.15);border-color:var(--gold);color:var(--gold3)}
.desc{font-size:.8rem;color:var(--text2);line-height:1.5;margin-top:2px}
.rec-desc{font-size:.86rem;color:var(--text);line-height:1.55;background:rgba(0,0,0,.22);border-radius:var(--radius);padding:8px 11px;margin:2px 0 6px}
.off-official{font-size:.6rem;color:var(--green2);border:1px solid var(--green);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:middle}

/* 추천(순위) */
.rec{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rec.best{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2),0 0 18px rgba(58,181,90,.12)}
.rec-head{display:flex;align-items:center;gap:11px;padding:11px 13px}
.rec.best .rec-head{background:linear-gradient(160deg,rgba(58,181,90,.12),transparent)}
.rec-rank{font-family:'Cinzel',serif;font-weight:700;font-size:1.05rem;color:var(--text3);width:20px;text-align:center;flex-shrink:0}
.rec.best .rec-rank{color:var(--green2)}
.rec-art{width:74px;height:74px;border-radius:6px;border:2px solid;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:1.6rem;flex-shrink:0;background-size:cover;background-position:top center}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:1.12rem;color:var(--text);font-weight:700}
.rec.best .rec-name{color:var(--green2)}
.rec-name .en{font-size:.66rem;color:var(--text3);font-weight:400;margin-left:5px}
.rec-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rec-pick{flex-shrink:0}
.rec-x{flex-shrink:0;color:var(--text3);cursor:pointer;font-size:.82rem;padding:0 3px;align-self:center}
.rec-x:hover{color:var(--red2)}
.rec-why{padding:0 13px 12px;font-size:.9rem;line-height:1.55}
.rec-lead{color:var(--text);margin-bottom:6px}
.rec.best .rec-lead{color:var(--gold3)}
.reasons{display:flex;flex-direction:column;gap:3px}
.reason{display:flex;gap:6px;align-items:flex-start;font-size:.85rem;line-height:1.4}
.reason.pos{color:var(--green2)} .reason.neg{color:var(--red2)} .reason.relic{color:var(--gold3)}
.reason .i{flex-shrink:0;font-size:.7rem;margin-top:1px}
.reason-sub{font-size:.7rem;color:var(--gold2);font-family:'Cinzel',serif;margin:3px 0 1px}
.skip-area{margin-top:4px;border:1px dashed var(--border2);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.15)}
.skip-area .st{flex:1;font-size:.86rem;color:var(--text2);line-height:1.5}
.skip-area.warn{border-color:var(--f)}

/* 유물 */
.sec-label{font-size:.72rem;color:var(--text2);font-family:'Cinzel',serif;letter-spacing:.05em;text-transform:uppercase}
.relic-line{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.rimg{width:28px;height:28px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--border2)}
/* 유물 타일(아이콘 + 이름 + 등급 + 효과설명) */
.rtile{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(240,168,60,.07);border:1px solid rgba(240,168,60,.22)}
.rtile-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtile-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtile-nm{font-size:.84rem;color:var(--text);font-weight:500}
.rtile-desc{font-size:.72rem;color:var(--text2);line-height:1.45}
.rtile-x{align-self:center;color:var(--text3);cursor:pointer;font-size:.82rem;padding:0 3px;flex-shrink:0}
.rtile-x:hover{color:var(--red2)}
.rtile-lock{align-self:center;color:var(--text3);font-size:.72rem;flex-shrink:0}
.divider{height:1px;background:var(--border);margin:1px 0}

/* 덱 그리드 */
.deck-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dcell{position:relative;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--border);border-radius:7px;overflow:hidden;cursor:default}
.dcell.upgraded{border-color:var(--gold);background:rgba(240,168,60,.06)}
.dcell.upnext{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2)}
.dtop{position:relative;width:100%;aspect-ratio:16/11;background:var(--bg4)}
.dart{width:100%;height:100%;background-size:cover;background-position:top center;cursor:pointer;display:block}
.dart-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:1.1rem}
.dtier{position:absolute;top:2px;left:2px;font-family:'Cinzel',serif;font-weight:700;font-size:.58rem;line-height:1;padding:2px 4px;border-radius:3px;border:1px solid;background:rgba(0,0,0,.6)}
.upplus{position:absolute;bottom:1px;right:3px;color:var(--gold3);font-weight:700;font-size:.85rem;text-shadow:0 0 3px #000,0 0 3px #000}
.dcell .dn{font-size:.68rem;color:var(--text);text-align:center;padding:3px 3px 2px;line-height:1.15;min-height:2.1em;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.dctrl{display:flex;border-top:1px solid var(--border);margin-top:auto}
.dctrl .up-btn{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--text3);font-size:.6rem;padding:3px 0;cursor:pointer;font-family:inherit;border-radius:0}
.dctrl .up-btn.on{background:rgba(240,168,60,.15);color:var(--gold3);font-weight:700}
.dctrl .up-btn:hover{color:var(--gold2)}
.dctrl .dx{width:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;font-size:.72rem}
.dctrl .dx:hover{color:var(--red2)}
.dcell .dbadge{position:absolute;top:2px;right:2px;font-size:.56rem;line-height:1;padding:2px 4px;border-radius:6px;border:1px solid;font-weight:700;z-index:2;background:rgba(0,0,0,.55)}
.b-upnext{color:#0a0a0b;background:var(--gold2);border-color:var(--gold2)}

/* 그리드 고르기 */
.grid-wrap{display:none;flex-direction:column;gap:7px}
.grid-wrap.open{display:flex}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:300px;overflow-y:auto;padding-right:3px}
.gcard{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px;cursor:pointer;transition:all .12s}
.gcard:hover{border-color:var(--gold);background:rgba(240,168,60,.08)}
.gcard .gt{font-family:'Cinzel',serif;font-weight:700;font-size:.7rem;width:16px;text-align:center;flex-shrink:0}
.gcard .gn{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:.72rem;color:var(--text3);line-height:1.6;background:rgba(0,0,0,.18);border:1px dashed var(--border2);border-radius:var(--radius);padding:8px 10px}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.footer{position:fixed;bottom:6px;right:12px;font-size:.6rem;color:var(--text3);opacity:.6;font-family:'Cinzel',serif;z-index:5}

/* 카드 클릭 → 상세 팝업 */
.pop{cursor:pointer}
.pop:hover{outline:2px solid var(--gold2);outline-offset:1px}
.modal-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);border-radius:12px 12px 0 0}
.modal-h .mnm{flex:1;font-size:1rem;color:var(--text);font-weight:500}
.modal-h .mnm .en{font-size:.7rem;color:var(--text3);margin-left:6px}
.modal-x{cursor:pointer;color:var(--text3);font-size:1.2rem;line-height:1;padding:0 4px;flex-shrink:0}
.modal-x:hover{color:var(--red2)}
.modal-b{padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal-art{width:210px;max-width:100%;aspect-ratio:1/1;border-radius:8px;background-size:cover;background-position:top center;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:2.2rem;font-weight:700}
.modal-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.modal-up{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.modal-up button{background:var(--bg3);border:none;color:var(--text2);padding:6px 16px;font-family:inherit;font-size:.82rem;cursor:pointer}
.modal-up button.on{background:rgba(240,168,60,.18);color:var(--gold3);font-weight:700}
.modal-desc{font-size:.92rem;color:var(--text);line-height:1.65;background:rgba(0,0,0,.24);border-radius:8px;padding:12px 14px;width:100%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">☠ Spire Codex 어드바이저<small>STS2 보조 도구 · 토대: Shunrai's STS2-Advisor (MIT)</small></div>
  <div class="char-tabs" id="char-tabs"></div>
  <div class="ctx">
    <div class="fg"><label>층</label><input type="number" id="floor" value="1" min="1" max="57"></div>
    <div class="fg"><label>막</label><input type="number" id="act" value="1" min="1" max="4"></div>
    <div class="fg"><label>다음</label>
      <select id="encounter"><option value="normal">일반</option><option value="elite">정예</option><option value="boss">보스</option></select>
    </div>
  </div>
</header>

<div class="cols">
  <!-- 왼쪽: 카드 선택 -->
  <div class="panel">
    <div class="panel-h"><h2>🂠 카드 선택</h2><span class="count" id="offered-count"></span></div>
    <div class="panel-b">
      <div style="display:flex;flex-direction:column;gap:5px">
        <span class="sec-label">아키타입 필터</span>

<script>
// ========================================================
//  Spire Codex 어드바이저 — Phase 1 (화면 + 수동 입력)  ※ 데이터 추출은 길 B로 별도 진행
// ========================================================
const CHARS = [
  {id:'ironclad',   ko:'아이언클래드', color:'#e04030'},
  {id:'silent',     ko:'사일런트',     color:'#3ab55a'},
  {id:'defect',     ko:'디펙트',       color:'#3090cc'},
  {id:'regent',     ko:'리젠트',       color:'#e8bc50'},
  {id:'necrobinder',ko:'네크로바인더', color:'#a066d8'},
];
const STARTER_RELICS = {
  ironclad:'Burning Blood', silent:'Ring of the Snake', defect:'Cracked Core',
  regent:'Divine Right', necrobinder:'Bound Phylactery',
};
const TIER_VAR={S:'var(--s)',A:'var(--a)',B:'var(--b)',C:'var(--c)',D:'var(--d)',F:'var(--f)'};
const GRADE_WORD={S:'최우선 픽',A:'좋은 픽',B:'무난한 픽',C:'애매함',D:'비추천',F:'스킵 권장'};

let state={ char:'ironclad', floor:1, act:1, encounter:'normal',
           deck:[], relics:[], offered:[], mode:'reward', archFilter:'current' };
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/"/g,'&quot;');
function tierColor(t){ return TIER_VAR[t]||'var(--text3)'; }

// 카드 그림: data/card_art.js 의 CARD_ART[영어id] → assets/cards/xxx.webp
function cardArt(name){
  // 기본 카드(타격/수비)는 캐릭터별 그림 사용
  const k=(name||'').toUpperCase().replace(/[\s\-]/g,'_').replace(/[^A-Z0-9_]/g,'').replace(/_+/g,'_');
  if((k==='STRIKE'||k==='DEFEND') && typeof BASIC_ART!=='undefined' && BASIC_ART[state.char] && BASIC_ART[state.char][k]) return 'assets/'+BASIC_ART[state.char][k];
  return (typeof CARD_ART!=='undefined' && CARD_ART[name]) ? ('assets/'+CARD_ART[name]) : null;
}
function artStyle(name, tier){ const a=cardArt(name);
  if(a) return `background-image:url('${a}');background-size:cover;background-position:top center`;
  return `color:${tierColor(tier)};background:linear-gradient(160deg,${tierColor(tier)}22,transparent)`; }
function artLetter(name, tier){ return cardArt(name) ? '' : tier; } // 그림 있으면 글자 숨김
function relicArt(name){ return (typeof RELIC_ART!=='undefined' && RELIC_ART[name]) ? ('assets/'+RELIC_ART[name]) : null; }
// 등급 배지 (S/A/B/C/D 색상 표기)
function gradeBadge(tier){ const c=tierColor(tier); return `<span class="gb" style="color:${c};border-color:${c};background:${c}1a">${tier||'?'}</span>`; }

// ── 수치 데이터(card_stats.js) ──
function statKey(s){ return (s||'').toUpperCase().replace(/[\s\-]/g,'_').replace(/[^A-Z0-9_]/g,'').replace(/_+/g,'_'); }
function cardStats(name){ const k=statKey(name);
  if(typeof CARD_STATS!=='undefined' && CARD_STATS[k]) return CARD_STATS[k];
  if(typeof RELIC_STATS!=='undefined' && RELIC_STATS[k]) return RELIC_STATS[k];
  return null; }
const TYPE_KO={Attack:'공격',Skill:'스킬',Power:'파워',Status:'상태이상',Curse:'저주'};
const TYPE_CLS={Attack:'t-atk',Skill:'t-skl',Power:'t-pow',Status:'t-etc',Curse:'t-etc'};
function typeBadge(name){ const s=cardStats(name); if(!s||!s.type)return ''; return `<span class="tb ${TYPE_CLS[s.type]||'t-etc'}">${TYPE_KO[s.type]||s.type}</span>`; }
function costBadge(name){ const s=cardStats(name); if(!s||s.cost==null)return ''; const c=(typeof s.cost==='number')?s.cost:s.cost; return `<span class="cb">${c}</span>`; }
const fmtN=n=>{ const x=Math.round(n*10)/10; return Number.isInteger(x)?String(x):String(x); };

// ── 설명 SmartFormat 해석기 ──────────────────────────────────
// 아이콘 토큰({energyPrefix} 등)과 조건부({IfUpgraded}/{InCombat})를 먼저 해석하고,
// {CalculatedX}는 C#의 CalculationBase(기본 계산값)로 별칭 처리한다.
const ICON_TOK={energyPrefix:'⚡',energySuffix:'⚡',singleStarIcon:'★',starIcon:'★'};
function varLookup(vars,key){ if(vars[key])return vars[key]; if(/^Calculated/.test(key)&&vars.CalculationBase)return vars.CalculationBase; return null; }
// 중괄호 중첩을 고려해 조건부/선택 템플릿을 분기 해석 (수치 {Var}만 남겨 뒤 단계에서 바인딩)
//  {IfUpgraded:...:A|B} → 강화 여부  ·  {InCombat:...:A|B} → 전투 밖(B)
//  {Name:choose(N):A|B} → 값==N? A:B (값 모르면 마지막 분기)  ·  분기 안 {}·{Name}는 값으로
function resolveCond(s, upgraded, vars){
  let out='', i=0;
  while(i<s.length){
    if(s[i]==='{'){
      let depth=0, j=i; for(; j<s.length; j++){ if(s[j]==='{')depth++; else if(s[j]==='}'){depth--; if(depth===0)break;} }
      if(j>=s.length){ out+=s.slice(i); break; }               // 짝 안 맞으면 그대로
      const block=s.slice(i+1,j);
      const name=(block.match(/^([A-Za-z0-9_]+)/)||[])[1]||'';
      if(name && block.indexOf('|')>=0){
        const rest=block.slice(name.length);
        // 최상위 '|'들로 분기 분할, 그 앞 마지막 최상위 ':'가 분기 시작
        let d=0, bars=[]; for(let k=0;k<rest.length;k++){const c=rest[k]; if(c==='{')d++; else if(c==='}')d--; else if(c==='|'&&d===0)bars.push(k);}
        let colon=-1; d=0; for(let k=0;k<bars[0];k++){const c=rest[k]; if(c==='{')d++; else if(c==='}')d--; else if(c===':'&&d===0)colon=k;}
        const mods=rest.slice(0,colon);
        const cuts=[colon, ...bars, rest.length];
        const opts=[]; for(let k=0;k<cuts.length-1;k++) opts.push(rest.slice(cuts[k]+1,cuts[k+1]));
        const v=varLookup(vars||{},name); const val=v?(upgraded?v.u:v.b):null;
        let chosen;
        if(name==='IfUpgraded') chosen=upgraded?opts[0]:(opts[1]!=null?opts[1]:'');
        else if(name==='InCombat') chosen=opts[1]!=null?opts[1]:'';        // 전투 밖
        else if(name==='OutOfCombat') chosen=opts[0];
        else { const cm=mods.match(/choose\(\s*(\d+)\s*\)/);                // choose(N)
          if(cm && val!=null) chosen = (val===+cm[1]) ? opts[0] : opts[opts.length-1];
          else chosen = opts[opts.length-1]; }
        // 분기 안의 이름 없는 자리표시자({} · {:diff()} = 그 값 자체) → 값 또는 ◆
        chosen=chosen.replace(/\{(?::[^{}]*)?\}/g, val!=null?fmtN(val):'◆');
        out+=resolveCond(chosen,upgraded,vars);
      } else { out+='{'+resolveCond(block,upgraded,vars)+'}'; }   // 단순 {Var}는 유지
      i=j+1;
    } else { out+=s[i]; i++; }
  }
  return out;
}
function preSmart(raw, upgraded, vars){
  let s=String(raw).replace(/\{(energyPrefix|energySuffix|singleStarIcon|starIcon)(?::[^{}]*)?\}/g,(m,k)=>ICON_TOK[k]||'');
  return resolveCond(s, upgraded, vars);
}

// 설명의 {Var:...} 를 실제 수치로 바인딩 (변화값은 강화전→후, 현재상태 강조)
function descHTML(name, upgraded){
  const raw=(typeof KO_OFF!=='undefined'&&KO_OFF[name])?KO_OFF[name].d:''; if(!raw)return '';
  const st=cardStats(name); const vars=(st&&st.vars)||{};
  let h=preSmart(raw,upgraded,vars).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\{([A-Za-z0-9_]+)(?::[^}]*)?\}/g,(m,key)=>{
    const v=varLookup(vars,key);
    if(!v) return '<span class="gv">◆</span>';
    if(v.u===v.b) return `<span class="gv">${fmtN(v.b)}</span>`;
    const before=`<span class="${upgraded?'gv2':'gv'}">${fmtN(v.b)}</span>`;
    const after =`<span class="${upgraded?'gv':'gv2'}">${fmtN(v.u)}</span>`;
    return `${before}<span class="uarrow">→</span>${after}`;
  });
  h=h.replace(/\[gold\]([\s\S]*?)\[\/gold\]/g,'<span class="gh">$1</span>')
     .replace(/\[[a-zA-Z_]+\]([\s\S]*?)\[\/[a-zA-Z_]+\]/g,'<span class="gh">$1</span>')
     .replace(/\[\/?[a-zA-Z_]+\]/g,'').replace(/\n/g,'<br>');
  return h;
}
// 툴팁용 평문 설명(값 바인딩, 변화값은 전→후)
function descText(name, upgraded){
  const raw=(typeof KO_OFF!=='undefined'&&KO_OFF[name])?KO_OFF[name].d:''; if(!raw)return '';
  const st=cardStats(name); const vars=(st&&st.vars)||{};
  return preSmart(raw,upgraded,vars).replace(/\{([A-Za-z0-9_]+)(?::[^}]*)?\}/g,(m,k)=>{const v=varLookup(vars,k);if(!v)return '?';return v.u===v.b?fmtN(v.b):fmtN(v.b)+'→'+fmtN(v.u);})
    .replace(/\[\/?[a-zA-Z_]+\]/g,'').replace(/\n/g,' ');
}

function save(){ try{ localStorage.setItem('spire_codex_kr', JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem('spire_codex_kr'); if(!r)return false;
  state=Object.assign(state, JSON.parse(r)); return true; }catch(e){ return false; } }

// ── 캐릭터 탭 ──
function renderTabs(){
  $('char-tabs').innerHTML = CHARS.map(c=>{
    const on=c.id===state.char;
    return `<div class="char-tab${on?' on':''}" data-char="${c.id}" style="${on?`color:${c.color};background:${c.color}22`:''}">
      <span class="dot" style="background:${c.color}"></span>${c.ko}</div>`;
  }).join('');
  $('char-tabs').querySelectorAll('.char-tab').forEach(t=>t.addEventListener('click',()=>{
    state.char=t.dataset.char; loadStarter(); state.offered=[]; state.archFilter='current'; renderAll();
  }));
}
function loadStarter(){
  state.deck=(STARTERS[state.char]||[]).map(n=>({name:n}));
  state.relics=STARTER_RELICS[state.char]?[STARTER_RELICS[state.char]]:[];
}

// ── 아키타입 매칭% (모든 아키타입) ──
function archMatches(){
  const da=analyzeDeck(state.char, state.deck);
  const uc={};
  for(const card of state.deck){
    const d=getCard(state.char,card.name); if(!d)continue;
    const tags=new Set([...(d.syn||[]),...(d.mech||[])]);
    for(const t of tags) uc[t]=(uc[t]||0)+1;
  }
  return (DB.archetypes[state.char]||[]).map(arch=>{
    let core=0,sup=0;
    for(const t of arch.core) core+=(uc[t]||0);
    for(const t of arch.support) sup+=(uc[t]||0);
    const ct=arch.coreThresh??arch.threshold??3, st=arch.supportThresh??Math.max(1,Math.floor(ct/2));
    const strength=Math.min(1,(core/ct)*0.65+(sup/Math.max(st,1))*0.35);
    return {arch, pct:Math.round(strength*100)};
  }).sort((a,b)=>b.pct-a.pct);
}
function renderChips(){
  const ms=archMatches();
  let html=`<div class="chip${state.archFilter==='current'?' on':''}" data-arch="current">현재 덱 기준</div>`;
  html+=ms.map(m=>`<div class="chip${state.archFilter===m.arch.id?' on':''}" data-arch="${m.arch.id}">
    ${koArch(m.arch.name)}<span class="pct">${m.pct}%</span></div>`).join('');
  $('arch-chips').innerHTML=html;
  $('arch-chips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    state.archFilter=c.dataset.arch; renderChips(); renderRec();
    if($('grid-wrap').classList.contains('open')) renderGrid();
  }));
}

// ── 자동완성 ──
function relicKey(n){ return n.toUpperCase().replace(/'/g,'').replace(/[\s-]+/g,'_').replace(/[^A-Z0-9_]/g,'').replace(/_+/g,'_').replace(/_+$/,''); }
function cardSource(){ return DB.names.filter(n=>n.c===state.char||n.c==='colorless'); }
function relicSource(){ return (DB.relicNames||[]).filter(n=>n.c===state.char||n.c==='any').map(n=>({n:n.n,relic:true})); }
function makeAC(input,acEl,source,onPick){
  const close=()=>acEl.classList.remove('open');
  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase(); if(q.length<1){close();return;}
    const hits=source().filter(h=>nameMatches(h.n,q)).slice(0,14);
    if(!hits.length){close();return;}
    acEl.innerHTML=hits.map(h=>{
      const d=h.relic?DB.relics[relicKey(h.n)]:getCard(state.char,h.n);
      const t=d?d.tier:'?', col=tierColor(t);
      return `<div class="ac-item" data-name="${esc(h.n)}"><span><span class="ac-name">${koName(h.n)}</span><span class="ac-en">${h.n}</span></span><span class="ac-tier" style="color:${col};border-color:${col}">${t}</span></div>`;
    }).join('');
    acEl.classList.add('open');
    acEl.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();onPick(el.dataset.name);input.value='';close();}));
  });
  input.addEventListener('keydown',e=>{
    const items=[...acEl.querySelectorAll('.ac-item')], cur=acEl.querySelector('.hi');
    if(e.key==='Escape'){close();return;}
    if(e.key==='Enter'){const t=cur||items[0];if(t){onPick(t.dataset.name);input.value='';close();}return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=cur?items.indexOf(cur):-1;if(cur)cur.classList.remove('hi');
      i=e.key==='ArrowDown'?Math.min(i+1,items.length-1):Math.max(i-1,0);if(items[i]){items[i].classList.add('hi');items[i].scrollIntoView({block:'nearest'});}}
  });
  document.addEventListener('click',e=>{if(!acEl.contains(e.target)&&e.target!==input)close();});
}

// ── 그리드 ──
function renderGrid(){
  const colorless=$('grid-colorless').checked;
  const pool=colorless?(DB.cards.colorless||{}):(DB.cards[state.char]||{});
  const q=$('grid-search').value.trim().toLowerCase();
  const TO={S:0,A:1,B:2,C:3,D:4,F:5};
  let list=Object.values(pool);
  if(q) list=list.filter(c=>nameMatches(c.id,q));
  if(!colorless && state.archFilter!=='current') list=list.filter(c=>(c.builds||[]).includes(state.archFilter));
  list.sort((a,b)=>(TO[a.tier]??3)-(TO[b.tier]??3)||koName(a.id).localeCompare(koName(b.id),'ko'));
  $('grid').innerHTML=list.map(c=>`<div class="gcard" data-name="${esc(c.id)}">${cardArt(c.id)?`<span class="dart" style="${artStyle(c.id,c.tier)}"></span>`:''}${gradeBadge(c.tier)}${typeBadge(c.id)}<span class="gn">${koName(c.id)}</span></div>`).join('')||`<div class="empty">결과 없음</div>`;
  $('grid').querySelectorAll('.gcard').forEach(el=>el.addEventListener('click',()=>addOffered(el.dataset.name)));
}

// ── 추가/제거 ──
function addOffered(n){ n=canonEN(n); if(state.offered.length>=8)return; state.offered.push(n); renderOffered(); renderRec(); save(); }
function removeOffered(i){ state.offered.splice(i,1); renderOffered(); renderRec(); save(); }
function removeOfferedByName(n){ const i=state.offered.indexOf(n); if(i>=0){ state.offered.splice(i,1); renderOffered(); renderRec(); save(); } }
function addDeck(n){ state.deck.push({name:canonEN(n)}); renderAll(); }
function removeDeck(i){ state.deck.splice(i,1); renderAll(); }
function pickCard(n){ // "이 카드 뽑기" — 덱에 넣기
  n=canonEN(n); state.deck.push({name:n});
  if(state.mode==='shop'){ // 상점: 여러 장 살 수 있으니 산 카드만 빼고 나머지 후보 유지
    const i=state.offered.indexOf(n); if(i>=0) state.offered.splice(i,1);
  } else { // 보상: 한 장 뽑으면 나머지 후보는 사라짐 → 추천 결과 비움
    state.offered=[];
  }
  renderAll();
}
function addRelic(n){ n=canonEN(n); if(!state.relics.includes(n)){ state.relics.push(n); renderAll(); } }
function removeRelic(i){ if(state.relics[i]===STARTER_RELICS[state.char])return; state.relics.splice(i,1); renderAll(); }

// ── 점수/배지 ──
function pickBadge(s){ if(s>=3.5)return'<span class="badge b-pick">✔ 픽</span>'; if(s>=2.5)return'<span class="badge b-maybe">~ 고려</span>'; return'<span class="badge b-skip">✕ 스킵</span>'; }
function recBadges(s,da){
  const d=getCard(state.char,s.name); const out=[];
  if(d){
    const fits=(d.builds||[]).some(b=>b!=='any'&&da.detected.some(x=>x.arch.id===b));
    if(fits) out.push('<span class="badge b-role">빌드 후보</span>');
    if((d.syn||[]).includes('block')||d.role==='defense'||getFunctionalRole(d)==='defense') out.push('<span class="badge b-maybe">초반 안정성</span>');
    if(d.role==='engine') out.push('<span class="badge b-role">엔진</span>');
    if(d.role==='payoff') out.push('<span class="badge b-role">보상</span>');
  }
  if(state.deck.filter(c=>norm(c.name)===norm(s.name)).length>0) out.push('<span class="badge b-dup">중복</span>');
  return out.join('');
}

// ── 렌더: 카드 선택(왼쪽 목록) ──
// 선택한 보상 카드는 가운데 "추천 결과"에만 표시(왼쪽은 입력/검색 전용). 여기선 개수만 갱신.
function renderOffered(){
  $('offered-count').textContent=state.offered.length?state.offered.length+'장':'';
}

// ── 렌더: 추천 결과(가운데) ──
function reasonLead(s,da){
  if(da.detected.length){
    const arch=koArch(da.detected[0].arch.name);
    const fits=(s.builds||[]).some(b=>b==='any'||da.detected.some(x=>x.arch.id===b));
    return fits?`현재 <b>${arch}</b> 빌드와 잘 맞아 추천합니다.`:`현재 빌드는 <b>${arch}</b>이지만, 카드 자체 가치로 평가했습니다.`;
  }
  return `아직 빌드가 정해지지 않아, 범용적으로 강한 카드 위주로 평가했습니다.`;
}
function renderRec(){
  const body=$('rec-body');
  if(!state.offered.length){ body.innerHTML=`<div class="empty">왼쪽에 지금 뜬 보상/상점 카드를 넣으면<br>순위 추천과 <b>한글 이유</b>가 나옵니다.</div>`; return; }
  const da=analyzeDeck(state.char,state.deck);
  const scored=state.offered.map(n=>scoreCard(n,state.char,da,state.floor,state.act,state.deck,state.encounter,state.relics));
  const sorted=[...scored].sort((a,b)=>b.finalScore-a.finalScore);
  const allBad=sorted.every(s=>s.finalScore<1.6);

  let html=sorted.map((s,idx)=>{
    const best=idx===0&&!allBad, col=tierColor(s.finalGrade);
    const relicR=s.synReasons.filter(r=>r.includes('유물'));
    const synR=s.synReasons.filter(r=>!r.includes('유물'));
    let reasons='';
    if(relicR.length){ reasons+=`<div class="reason-sub">◈ 보유 유물 영향</div>`+relicR.map(r=>`<div class="reason relic"><span class="i">◈</span>${r.replace(/^◈\s*/,'')}</div>`).join(''); }
    reasons+=synR.map(r=>`<div class="reason pos"><span class="i">▲</span>${r}</div>`).join('')
           +s.antiReasons.map(r=>`<div class="reason neg"><span class="i">▼</span>${r}</div>`).join('');
    if(!reasons) reasons=`<div class="reason"><span class="i">·</span>특별한 시너지·충돌 없음.</div>`;
    return `<div class="rec${best?' best':''}">
      <div class="rec-head">
        <div class="rec-rank">${idx+1}</div>
        <div class="rec-art pop" data-card="${esc(s.name)}" title="클릭: 상세" style="border-color:${col};${cardArt(s.name)?artStyle(s.name):'color:'+col}">${cardArt(s.name)?'':s.finalGrade}</div>
        <div class="rec-info">
          <div class="rec-name">${costBadge(s.name)}${gradeBadge(s.base)}${typeBadge(s.name)} ${koName(s.name)}<span class="en">${s.name}</span></div>
          <div class="rec-badges">${recBadges(s,da)}${pickBadge(s.finalScore)}</div>
        </div>
        <button class="btn ${best?'green':'gold'} rec-pick" data-name="${esc(s.name)}">${best?'① 이 카드 뽑기':'뽑기'}</button>
        <span class="rec-x" data-name="${esc(s.name)}" title="이 카드 빼기">✕</span>
      </div>
      <div class="rec-why">
        ${descHTML(s.name,false)?`<div class="rec-desc">${descHTML(s.name,false)}</div>`:''}
        <div class="rec-lead">${best?reasonLead(s,da):`추천 등급 ${s.finalGrade} · ${GRADE_WORD[s.finalGrade]}`}</div>
        <div class="reasons">${reasons}</div>
      </div></div>`;
  }).join('');

  // 스킵 영역
  const best=sorted[0];
  const skipWarn=allBad||best.finalScore<2.5;
  html+=`<div class="skip-area${skipWarn?' warn':''}">
    <div class="st">${skipWarn?'⚠ 지금 후보들은 현재 빌드에 큰 도움이 안 됩니다. <b>스킵</b>(또는 체력/골드)이 나을 수 있어요.':'괜찮은 선택지가 있습니다. 위 1순위를 뽑으세요.'}</div>
    <button class="btn" id="skip-btn">스킵하기</button></div>`;

  body.innerHTML=html;
  body.querySelectorAll('.rec-pick').forEach(b=>b.addEventListener('click',()=>pickCard(b.dataset.name)));
  body.querySelectorAll('.rec-x').forEach(x=>x.addEventListener('click',()=>removeOfferedByName(x.dataset.name)));
  $('skip-btn').addEventListener('click',()=>{ state.offered=[]; renderOffered(); renderRec(); save(); });
}

// ── 강화 우선 판정 ──
function isUpgradePriority(name,da){
  if(isStarter(name))return false;
  const d=getCard(state.char,name); if(!d)return false;
  const tierVal={S:5,A:4,B:3,C:2,D:1,F:0}[d.tier]??2;
  // 강한 카드(A+·엔진·보상·성장)는 아키타입 감지와 무관하게 강화 후보. (fits는 순위 보너스로만)
  const key=tierVal>=4||d.role==='engine'||d.role==='payoff'||(d.syn||[]).includes('scaling')||(d.mech||[]).includes('permanent_scaling');
  const st=cardStats(name); const canUp=st&&Object.values(st.vars||{}).some(v=>v.u!==v.b);
  return key&&canUp;
}
// 강화 우선순위 점수(높을수록 먼저 강화). 이미 강화한 카드/강화효과 없는 카드는 뒤로.
function upgradeScore(name,da){
  const d=getCard(state.char,name); if(!d)return -99;
  const st=cardStats(name); const canUp=st&&Object.values(st.vars||{}).some(v=>v.u!==v.b);
  if(!canUp)return -99;
  const tierVal={S:5,A:4,B:3,C:2,D:1,F:0}[d.tier]??2;
  let s=tierVal;
  if(d.role==='engine')s+=2.5; else if(d.role==='payoff')s+=1.5;
  if((d.syn||[]).includes('scaling')||(d.mech||[]).includes('permanent_scaling'))s+=1.5;
  const fits=!(d.builds||[]).length||(d.builds||[]).some(b=>b==='any'||da.detected.some(x=>x.arch.id===b));
  if(fits)s+=1;                // 빌드에 맞으면 가점(감점은 없음 — 강한 카드가 묻히지 않게)
  if(isStarter(name))s-=1.5;   // 시작 카드(타격/수비)는 강화 가치 낮음
  return s;
}

// ── 카드 상세 팝업 ──
// 팝업 전용: {Var}를 (강화 여부에 따른) 단일 값으로 렌더 → 토글이 실제로 값이 바뀜
function modalDescHTML(name, upgraded){
  const raw=(typeof KO_OFF!=='undefined'&&KO_OFF[name])?KO_OFF[name].d:''; if(!raw)return '';
  const st=cardStats(name); const vars=(st&&st.vars)||{};
  let h=preSmart(raw,upgraded,vars).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\{([A-Za-z0-9_]+)(?::[^}]*)?\}/g,(m,key)=>{
    const v=varLookup(vars,key); if(!v) return '<span class="gv">◆</span>';
    const val=upgraded?v.u:v.b;
    return `<span class="gv">${fmtN(val)}</span>`;
  });
  h=h.replace(/\[gold\]([\s\S]*?)\[\/gold\]/g,'<span class="gh">$1</span>')
     .replace(/\[[a-zA-Z_]+\]([\s\S]*?)\[\/[a-zA-Z_]+\]/g,'<span class="gh">$1</span>')
     .replace(/\[\/?[a-zA-Z_]+\]/g,'').replace(/\n/g,'<br>');
  return h;
}
let modalCard=null, modalUp=false;
function openCardModal(name){ modalCard=canonEN(name); modalUp=false; renderModal(); $('card-modal').classList.add('open'); }
function closeCardModal(){ $('card-modal').classList.remove('open'); modalCard=null; }
function renderModal(){
  const name=modalCard; if(!name)return;
  const d=getCard(state.char,name); const t=d?d.tier:'?'; const art=cardArt(name);
  const st=cardStats(name); const canUp=!!(st&&Object.values(st.vars||{}).some(v=>v.u!==v.b));
  $('modal-nm').innerHTML=`${koName(name)}<span class="en">${name}</span>`;
  const ma=$('modal-art');
  ma.setAttribute('style', art?`background-image:url('${art}')`:`color:${tierColor(t)}`);
  ma.textContent=art?'':t;
  $('modal-meta').innerHTML=`${costBadge(name)}${gradeBadge(t)}${typeBadge(name)}${hasOfficial(name)?'<span class="off-official">공식</span>':''}`;
  $('modal-desc').innerHTML=modalDescHTML(name,modalUp)||'<span style="color:var(--text3)">설명 정보 없음</span>';
  $('modal-up-wrap').style.display=canUp?'flex':'none';
  $('modal-up-base').classList.toggle('on',!modalUp);
  $('modal-up-plus').classList.toggle('on',modalUp);
}

// ── 렌더: 유물 ──
function renderRelics(){
  if(!state.relics.length){ $('relics').innerHTML=`<span style="color:var(--text3);font-size:.74rem">없음</span>`; return; }
  $('relics').innerHTML=state.relics.map((n,i)=>{
    const d=DB.relics[relicKey(n)],t=d?d.tier:'?',col=tierColor(t);
    const starter=n===STARTER_RELICS[state.char]; const art=relicArt(n);
    const desc=descHTML(n,false);
    const icon=art?`<span class="rimg" style="background-image:url('${art}')"></span>`
      :`<span class="rimg" style="display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:${col}">${t}</span>`;
    return `<div class="rtile">${icon}
      <div class="rtile-body">
        <div class="rtile-top">${gradeBadge(t)}<span class="rtile-nm">${koName(n)}</span></div>
        ${desc?`<div class="rtile-desc">${desc}</div>`:''}
      </div>
      ${starter?`<span class="rtile-lock" title="시작 유물(고정)">🔒</span>`:`<span class="rtile-x" data-i="${i}" title="제거">✕</span>`}
    </div>`;
  }).join('');
  $('relics').querySelectorAll('.rtile-x').forEach(el=>el.addEventListener('click',()=>removeRelic(+el.dataset.i)));
}

// ── 렌더: 덱 그리드 ──
function renderDeck(){
  $('deck-count').textContent=state.deck.length+'장';
  const g=$('deck-grid');
  if(!state.deck.length){ g.innerHTML=`<div class="empty" style="grid-column:1/4">덱이 비어 있습니다. ‘시작 덱’을 누르거나 카드를 추가하세요.</div>`; return; }
  const da=analyzeDeck(state.char,state.deck);
  // 다음 강화 1순위: 아직 강화 안 한 카드 중 우선순위 점수 최고 (강화할수록 다음 카드로 이동)
  let nextIdx=-1, nextScore=-Infinity;
  state.deck.forEach((c,i)=>{ if(c.up)return; if(!isUpgradePriority(c.name,da))return;
    const sc=upgradeScore(c.name,da); if(sc>nextScore){ nextScore=sc; nextIdx=i; } });
  g.innerHTML=state.deck.map((card,i)=>{
    const name=card.name, d=getCard(state.char,name), t=d?d.tier:'?', col=tierColor(t);
    const up=!!card.up;
    const rem=scoreRemoval(name,state.char,da,state.deck,state.relics);
    const upPri=!up&&isUpgradePriority(name,da);
    let badge='', cls='';
    if(i===nextIdx){ badge='<span class="dbadge b-upnext" title="다음 강화 우선순위">⬆ 다음</span>'; cls=' upnext'; }
    else if(upPri) badge='<span class="dbadge b-up" title="강화 우선 후보">⬆</span>';
    else if(!up&&rem.safeToRemove) badge='<span class="dbadge b-cut" title="제거 추천">🗑</span>';
    const dt=descText(name,up);
    const tip=(up?'[강화됨] ':'')+(dt?dt+' · ':'')+(i===nextIdx?'다음 강화 우선순위 · ':upPri?'강화 우선 후보 · ':'')+(rem.reason||'');
    const artInner=cardArt(name)
      ? `<span class="dart pop" data-card="${esc(name)}" title="클릭: 상세" style="${artStyle(name,t)}"></span>`
      : `<span class="dart-fb pop" data-card="${esc(name)}" style="color:${col}">${t}</span>`;
    return `<div class="dcell${up?' upgraded':''}${cls}" title="${esc(tip)}">
      <div class="dtop">${artInner}<span class="dtier" style="color:${col};border-color:${col}">${t}</span>${badge}${up?'<span class="upplus">+</span>':''}</div>
      <span class="dn">${koName(name)}</span>
      <div class="dctrl">
        <button class="up-btn${up?' on':''}" data-up="${i}" title="강화 전/후 전환">강화${up?'+':''}</button>
        <span class="dx" data-i="${i}" title="빼기">✕</span>
      </div></div>`;
  }).join('');
  g.querySelectorAll('.dx').forEach(x=>x.addEventListener('click',()=>removeDeck(+x.dataset.i)));
  g.querySelectorAll('.up-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const i=+b.dataset.up;state.deck[i].up=!state.deck[i].up;renderDeck();save();}));
}

function renderAll(){
  renderTabs(); renderChips(); renderRelics(); renderDeck(); renderOffered(); renderRec();
  if($('grid-wrap').classList.contains('open')) renderGrid();
  save();
}

// ── 이벤트 ──
$('floor').addEventListener('input',()=>{ state.floor=+$('floor').value||1; state.act=floorToAct(state.floor); $('act').value=state.act; renderOffered(); renderRec(); renderChips(); save(); });
$('act').addEventListener('input',()=>{ state.act=+$('act').value||1; renderOffered(); renderRec(); save(); });
$('encounter').addEventListener('change',()=>{ state.encounter=$('encounter').value; renderOffered(); renderRec(); save(); });
document.querySelectorAll('.subtab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  state.mode=t.dataset.mode; renderOffered(); save();
}));
$('grid-toggle').addEventListener('click',()=>{ const g=$('grid-wrap'); g.classList.toggle('open');
  $('grid-toggle').textContent=g.classList.contains('open')?'⊟ 그리드 닫기':'⊞ 카드 그리드에서 고르기'; if(g.classList.contains('open'))renderGrid(); });
$('grid-search').addEventListener('input',renderGrid);
$('grid-colorless').addEventListener('change',renderGrid);
$('offer-clear').addEventListener('click',()=>{ state.offered=[]; renderOffered(); renderRec(); save(); });
$('load-starter').addEventListener('click',()=>{ loadStarter(); renderAll(); });
$('deck-clear').addEventListener('click',()=>{ state.deck=[]; renderAll(); });
makeAC($('offer-input'),$('offer-ac'),cardSource,addOffered);
makeAC($('deck-input'),$('deck-ac'),cardSource,addDeck);
makeAC($('relic-input'),$('relic-ac'),relicSource,addRelic);

// ── 카드 상세 팝업 이벤트 (카드 그림 클릭) ──
document.addEventListener('click',e=>{ const el=e.target.closest('.pop[data-card]'); if(el){ e.stopPropagation(); openCardModal(el.dataset.card); } });
$('modal-x').addEventListener('click',closeCardModal);
$('card-modal').addEventListener('click',e=>{ if(e.target===$('card-modal')) closeCardModal(); });
$('modal-up-base').addEventListener('click',()=>{ modalUp=false; renderModal(); });
$('modal-up-plus').addEventListener('click',()=>{ modalUp=true; renderModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('card-modal').classList.contains('open')) closeCardModal(); });

// ── 초기화 ──
if(!load()){ loadStarter(); }
if(location.search.includes('demo')){ state.char='ironclad'; loadStarter();
  state.relics=['Burning Blood',"Charon's Ashes"]; state.floor=10; state.act=2;
  state.offered=['Bash','Whirlwind','Inflame'];
  if(state.deck[9]) state.deck[9].up=true; /* 강타 강화 예시 */ }
$('floor').value=state.floor; $('act').value=floorToAct(state.floor); state.act=+$('act').value; $('encounter').value=state.encounter;
document.querySelectorAll('.subtab').forEach(t=>t.classList.toggle('on',t.dataset.mode===state.mode));
// 게임에서 추출한 데이터 버전 표시 (loc_ko.js 있으면)
if(typeof window.KO_OFF_VERSION!=='undefined' && window.KO_OFF_VERSION){
  document.querySelector('.footer').innerHTML = 'MIT © 2026 Shunrai · 한국어판 · 게임 데이터 STS2 '+window.KO_OFF_VERSION+' 추출';
}
renderAll();
</script>
